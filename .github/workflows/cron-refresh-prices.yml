# Refresh de precios por chunks: cada hora procesa ~20 deals (cursor en la tabla
# cron_state de Turso), así el ciclo completo cubre todo el catálogo a diario.
# Vercel Cron en plan Hobby solo permite frecuencia diaria → este endpoint se
# dispara desde aquí. Requiere el secret CRON_SECRET en el repo.
name: cron-refresh-prices

on:
  # Pausado 21-oct-2026: Amazon bloquea el scrape desde la IP de Vercel
  # (20/20 fallos con "Amazon scrape returned no result"). El refresh fiable
  # corre en local con la tarea PesCatch-RefreshPrices (08:00).
  # Re-activar el schedule si se añade proxy/PA-API o Amazon deja de bloquear.
  workflow_dispatch: {}

concurrency:
  group: cron-refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Llamar /api/cron/refresh-prices
        run: |
          code=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "https://www.pescatch.es/api/cron/refresh-prices" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 330)
          echo "HTTP $code"
          cat response.json

          processed=$(jq -r '.processed // 0' response.json)
          remaining=$(jq -r '.remaining // 0' response.json)
          if [ "$code" = "200" ] && [ "$processed" -eq 0 ] && [ "$remaining" -gt 0 ]; then
            echo "::error::El refresh procesó 0 deals pero quedan $remaining elegibles (cursor atascado)"
            exit 1
          fi

          failed=$(jq -r '.failed // 0' response.json)
          if [ "$code" = "200" ] && [ "$processed" -gt 0 ] && [ "$failed" -eq "$processed" ]; then
            echo "::error::Todos los deals del chunk fallaron ($failed/$processed): Amazon probablemente bloquea el scrape desde Vercel"
            exit 1
          fi

          exit $([ "$code" = "200" ] && echo 0 || echo 1)
